format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$c\
$cpp\
$lua\
$line_break\
$character"""

[username]
disabled = false
show_always = true
format = '[$user]($style)'

[hostname]
ssh_only = false
format = '@[$hostname]($style)'

[directory]
truncation_length = 3
truncation_symbol = ".../"

[cmd_duration]
disabled = false
show_milliseconds = false
format = '[$duration]($style)'

[c]
disabled = false
symbol = 'c '
format = '[$symbol($name)]($style)'

[cpp]
disabled = false
symbol = 'c++ '
format = '[$symbol($name)]($style)'

[lua]
disabled = false
format = '[$symbol]($style)'

[character]
success_symbol = "[➜]($style)"
error_symbol = "[➜]($style)"

