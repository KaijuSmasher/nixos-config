format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$c\
$cpp\
$dotnet\
$java\
$lua\
$python\
$nodejs\
$aws\
$docker_context\
$jobs\
$line_break\
$character"""

[username]
disabled = false
show_always = true

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[cpp]
disabled = false
symbol = " "
style = "bold blue"
