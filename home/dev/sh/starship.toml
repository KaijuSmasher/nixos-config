format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$c\
$cpp\
$lua\
$line_break\
$character"""

[username]
disabled = false
show_always = true
format = '[$user]($style)'

[hostname]
ssh_only = false
format = '@[$hostname]($style)'

[directory]
truncation_length = 3
truncation_symbol = ".../"

[character]
success_symbol = "[➜]($style)"
error_symbol = "[➜]($style)"

[cpp]
disabled = false
