[metadata]
name = "Saber Alter"
author = "Custom Fate Scheme"

[colors]
# The obsidian-black armor tone
background = "#111215" 
# Cursed visor gold/pale skin tint
foreground = "#eeede9" 

cursor_bg = "#dd5555"
cursor_fg = "#111215"
selection_bg = "#5a2228"
selection_fg = "#eeede9"

ansi = [
  "#1c1d23", # black (Armor base, lifted slightly so it shows on the background)
  "#d64d4d", # red (Excalibur Morgan crimson)
  "#9a78b8", # green (Substituted with corrupted purple)
  "#ffd700", # yellow (Visor gold)
  "#7b7ad4", # blue (Deep tainted magic)
  "#bd6ccc", # magenta (Bursting dark energy)
  "#7f93b3", # cyan (Muted steel)
  "#d5d2cb"  # white (Pale dress cloth)
]

brights = [
  "#5c5f6e", # bright black (readable for comments)
  "#ee5b5b", # bright red
  "#b898d4", # bright green/purple
  "#fce2a5", # bright yellow
  "#a2a0f0", # bright blue
  "#da92e8", # bright magenta
  "#a3b6d2", # bright cyan
  "#ffffff"  # bright white
]
